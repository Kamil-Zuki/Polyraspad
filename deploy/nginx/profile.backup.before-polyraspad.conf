server {
    listen 443 ssl default_server; # Catch all unhandled HTTPS requests
    server_name _; # Wildcard to catch non-matching domains

    ssl_certificate /etc/letsencrypt/live/polyraspad.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyraspad.online/privkey.pem;

    location / {
        return 444; # Silently drop invalid requests
    }
}

server {
    listen 443 ssl;
    server_name polyraspad.online;

    ssl_certificate /etc/letsencrypt/live/polyraspad.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyraspad.online/privkey.pem;

    location / {
        return 404; # Root domain unused
    }
}

server {
    listen 443 ssl;
    server_name profile.polyraspad.online;

    ssl_certificate /etc/letsencrypt/live/polyraspad.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyraspad.online/privkey.pem;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name app.polyraspad.online;

    ssl_certificate /etc/letsencrypt/live/polyraspad.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyraspad.online/privkey.pem;

    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.polyraspad.online;

    ssl_certificate /etc/letsencrypt/live/polyraspad.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyraspad.online/privkey.pem;

    location / {
        proxy_pass http://localhost:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
