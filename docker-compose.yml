services:
  postgres:
    container_name: postgres
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - backend
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    volumes:
      - minio-data:/data
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done;
      until /usr/bin/mc ready myminio; do sleep 1; done;
      /usr/bin/mc mb myminio/polyraspad-media 2>/dev/null || true;
      /usr/bin/mc anonymous set download myminio/polyraspad-media;
      echo 'Bucket polyraspad-media is now public for read';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    networks:
      - backend

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - backend
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  inclusive:
    container_name: inclusive
    build:
      context: ./inclusive
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "40051"

  authorization-module:
    container_name: authorization-module
    build:
      context: ./authorization-module
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5027"
    environment:
      ConnectionStrings__Db: "Server=postgres;Port=5432;Database=auth-module;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me-postgres-password}"
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_RUNNING_IN_CONTAINER: "true"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      Jwt__Secret: "${JWT_SECRET:-change-me-use-at-least-32-characters-long-secret}"
      Jwt__Issuer: "${JWT_ISSUER:-polyraspad.local}"
      Jwt__Audience: "${JWT_AUDIENCE:-polyraspad.local}"
      ConfirmationLink: "${AUTH_CONFIRMATION_LINK:-http://localhost:5000/api/Auth/confirm-email?userId}"
      Email__Host: "${SMTP_HOST:-smtp.example.com}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__UserName: "${SMTP_USERNAME:-change-me@example.com}"
      Email__Password: "${SMTP_PASSWORD:-change-me-smtp-password}"
      Email__Address: "${SMTP_ADDRESS:-no-reply@example.com}"
      Email__DisplayName: "${SMTP_DISPLAY_NAME:-Polyraspad}"

  vocabulary-service:
    container_name: vocabulary-service
    build:
      context: ./VocabularyService
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "5117"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inclusive:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_UID: "0"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=vocabulary_service;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me-postgres-password}"
      ConnectionStrings__Redis: "redis:6379"
      Inclusive__GrpcAddress: "http://inclusive:40051"
      Inclusive__UseForFsrs: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      Storage__Endpoint: "http://minio:9000"
      Storage__Bucket: "polyraspad-media"
      Storage__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      Storage__SecretKey: "${MINIO_ROOT_PASSWORD:-change-me-minio-password}"
      Storage__UsePathStyle: "true"
      Storage__PublicBaseUrl: "${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/polyraspad-media}"
      Storage__ServerFetchBaseUrl: "${MINIO_SERVER_FETCH_BASE_URL:-http://minio:9000/polyraspad-media}"

  aggregator-service:
    container_name: aggregator-service
    build:
      context: ./AggregatorService
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5206"
    networks:
      - backend
    depends_on:
      vocabulary-service:
        condition: service_started
      authorization-module:
        condition: service_started
    environment:
      APP_UID: "0"
      ASPNETCORE_URLS: "http://0.0.0.0:5206"
      AggregatorService__VocabularyServiceBaseUrl: "http://vocabulary-service:5117"
      AggregatorService__AuthorizationModuleBaseUrl: "http://authorization-module:5027"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      Jwt__Secret: "${JWT_SECRET:-change-me-use-at-least-32-characters-long-secret}"
      Jwt__Issuer: "${JWT_ISSUER:-polyraspad.local}"
      Jwt__Audience: "${JWT_AUDIENCE:-polyraspad.local}"
      Ollama__BaseUrl: "http://ollama:11434"
      Ollama__Model: "phi3:mini"
      Ollama__Enabled: "true"
      Ollama__ProxyApiKey: "${OLLAMA_PROXY_API_KEY:-}"
      Ollama__AllowClientModelOverride: "false"
      DOTNET_RUNNING_IN_CONTAINER: "true"

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - backend
    expose:
      - "11434"

  polyraspad-frontend:
    container_name: polyraspad-frontend
    build:
      context: ./polyraspad-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      aggregator-service:
        condition: service_started
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      OLLAMA_PROXY_API_KEY: "${OLLAMA_PROXY_API_KEY:-}"
      AGGREGATOR_INTERNAL_URL: http://aggregator-service:5206

  polyraspad-landing:
    container_name: polyraspad-landing
    build:
      context: ./polyraspad-landing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${LANDING_NEXT_PUBLIC_APP_URL:-https://app.polyraspad.online}
        NEXT_PUBLIC_SITE_URL: ${LANDING_NEXT_PUBLIC_SITE_URL:-https://polyraspad.online}
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - backend
    environment:
      NODE_ENV: production

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  redis-data:
  ollama-data:
