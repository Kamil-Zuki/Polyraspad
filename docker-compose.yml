services:
  postgres:
    container_name: postgres
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: postgres
    ports:
      - "5454:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  inclusive:
    container_name: inclusive
    build:
      context: ./inclusive
      dockerfile: Dockerfile
    ports:
      - "40051:40051"
    networks:
      - backend

  authorization-module:
    container_name: authorization-module
    build:
      context: ./authorization-module
      dockerfile: Dockerfile
    ports:
      - "5027:5027"
    networks:
      - backend
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Db: "Server=postgres;Port=5432;Database=auth-module;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123}"
      ASPNETCORE_ENVIRONMENT: Production

  vocabulary-service:
    container_name: vocabulary-service
    build:
      context: ./VocabularyService
      dockerfile: Dockerfile
    ports:
      - "5117:5117"
    networks:
      - backend
    depends_on:
      - postgres
      - inclusive
    environment:
      APP_UID: "0"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=vocabulary_service;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123}"
      Inclusive__GrpcAddress: "http://inclusive:40051"
      Inclusive__UseForFsrs: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"

  aggregator-service:
    container_name: aggregator-service
    build:
      context: ./AggregatorService
      dockerfile: Dockerfile
    ports:
      - "5000:5206"
    networks:
      - backend
    depends_on:
      - vocabulary-service
      - authorization-module
    environment:
      APP_UID: "0"
      ASPNETCORE_URLS: "http://0.0.0.0:5206"
      AggregatorService__VocabularyServiceBaseUrl: "http://vocabulary-service:5117"
      AggregatorService__AuthorizationModuleBaseUrl: "http://authorization-module:5027"
      DOTNET_RUNNING_IN_CONTAINER: "true"

  polyraspad-frontend:
    container_name: polyraspad-frontend
    build:
      context: ./polyraspad-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      - aggregator-service
    environment:
      NODE_ENV: production

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
