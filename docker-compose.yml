services:
  postgres:
    container_name: postgres
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: postgres
    ports:
      - "5454:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/polyraspad-media 2>/dev/null || true;
      /usr/bin/mc anonymous set download myminio/polyraspad-media;
      echo 'Bucket polyraspad-media is now public for read';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - backend

  inclusive:
    container_name: inclusive
    build:
      context: ./inclusive
      dockerfile: Dockerfile
    ports:
      - "40051:40051"
    networks:
      - backend

  authorization-module:
    container_name: authorization-module
    build:
      context: ./authorization-module
      dockerfile: Dockerfile
    ports:
      - "5027:5027"
    networks:
      - backend
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Db: "Server=postgres;Port=5432;Database=auth-module;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123}"
      ASPNETCORE_ENVIRONMENT: Production

  vocabulary-service:
    container_name: vocabulary-service
    build:
      context: ./VocabularyService
      dockerfile: Dockerfile
    ports:
      - "5117:5117"
    networks:
      - backend
    depends_on:
      - postgres
      - inclusive
      - minio
      - minio-init
    environment:
      APP_UID: "0"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=vocabulary_service;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-123}"
      Inclusive__GrpcAddress: "http://inclusive:40051"
      Inclusive__UseForFsrs: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      Storage__Endpoint: "http://minio:9000"
      Storage__Bucket: "polyraspad-media"
      Storage__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      Storage__SecretKey: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      Storage__UsePathStyle: "true"
      Storage__PublicBaseUrl: "http://localhost:9000/polyraspad-media"
      Storage__ServerFetchBaseUrl: "http://minio:9000/polyraspad-media"

  aggregator-service:
    container_name: aggregator-service
    build:
      context: ./AggregatorService
      dockerfile: Dockerfile
    ports:
      - "5000:5206"
    networks:
      - backend
    depends_on:
      - vocabulary-service
      - authorization-module
    environment:
      APP_UID: "0"
      ASPNETCORE_URLS: "http://0.0.0.0:5206"
      AggregatorService__VocabularyServiceBaseUrl: "http://vocabulary-service:5117"
      AggregatorService__AuthorizationModuleBaseUrl: "http://authorization-module:5027"
      DOTNET_RUNNING_IN_CONTAINER: "true"

  polyraspad-frontend:
    container_name: polyraspad-frontend
    build:
      context: ./polyraspad-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      - aggregator-service
    environment:
      NODE_ENV: production

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
