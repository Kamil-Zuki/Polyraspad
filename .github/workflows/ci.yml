name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore VocabularyService
        working-directory: VocabularyService
        run: dotnet restore

      - name: Build VocabularyService
        working-directory: VocabularyService
        run: dotnet build -c Release --no-restore

      - name: Test VocabularyService
        working-directory: VocabularyService
        run: dotnet test ../VocabularyService.Tests/VocabularyService.Tests.csproj -c Release --verbosity normal

      - name: Restore AggregatorService
        working-directory: AggregatorService
        run: dotnet restore

      - name: Build AggregatorService
        working-directory: AggregatorService
        run: dotnet build -c Release --no-restore

      - name: Test AggregatorService
        working-directory: AggregatorService
        run: dotnet test ../AggregatorService.Tests/AggregatorService.Tests.csproj -c Release --verbosity normal

      - name: Restore authorization-module
        working-directory: authorization-module
        run: dotnet restore

      - name: Build authorization-module
        working-directory: authorization-module
        run: dotnet build -c Release --no-restore

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: polyraspad-frontend/package-lock.json

      - name: Install dependencies
        working-directory: polyraspad-frontend
        run: npm ci

      - name: Build
        working-directory: polyraspad-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [dotnet, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
