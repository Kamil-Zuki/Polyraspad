name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Private submodule repos require SUBMODULES_PAT (classic PAT with repo scope).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKOUT_TOKEN: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}

jobs:
  vocabulary-service:
    name: VocabularyService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Initialize submodule
        run: |
          git submodule sync -- VocabularyService
          git submodule update --init --depth 1 VocabularyService

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: VocabularyService
        run: dotnet restore

      - name: Build
        working-directory: VocabularyService
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test VocabularyService.Tests/VocabularyService.Tests.csproj -c Release --verbosity normal

  aggregator-service:
    name: AggregatorService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Initialize submodule
        run: |
          git submodule sync -- AggregatorService
          git submodule update --init --depth 1 AggregatorService

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: AggregatorService
        run: dotnet restore

      - name: Build
        working-directory: AggregatorService
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test AggregatorService.Tests/AggregatorService.Tests.csproj -c Release --verbosity normal

  billing-service:
    name: BillingService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Initialize submodule
        run: |
          git submodule sync -- BillingService
          git submodule update --init --depth 1 BillingService

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: BillingService
        run: dotnet restore

      - name: Build
        working-directory: BillingService
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test BillingService.Tests/BillingService.Tests.csproj -c Release --verbosity normal

  agent-service:
    name: AgentService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: AgentService
        run: dotnet restore

      - name: Build
        working-directory: AgentService
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test AgentService.Tests/AgentService.Tests.csproj -c Release --verbosity normal

  media-service:
    name: MediaService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: MediaService
        run: dotnet restore

      - name: Build
        working-directory: MediaService
        run: dotnet build -c Release --no-restore

  authorization-module:
    name: authorization-module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Initialize submodule
        run: |
          git submodule sync -- authorization-module
          git submodule update --init --depth 1 authorization-module

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: authorization-module
        run: dotnet restore authorization-module.sln

      - name: Build
        working-directory: authorization-module
        run: dotnet build authorization-module.sln -c Release --no-restore

  inclusive:
    name: inclusive (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Initialize submodule
        run: |
          git submodule sync -- inclusive
          git submodule update --init --depth 1 inclusive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: inclusive/requirements.txt

      - name: Install dependencies
        working-directory: inclusive
        run: pip install -r requirements.txt

      - name: Test
        working-directory: inclusive
        run: pytest test_fsrs_review_card.py -v

  frontend:
    name: polyraspad-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}

      - name: Initialize submodule
        run: |
          git submodule sync -- polyraspad-frontend
          git submodule update --init --depth 1 polyraspad-frontend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: polyraspad-frontend/package-lock.json

      - name: Install
        working-directory: polyraspad-frontend
        run: npm ci

      - name: Lint
        working-directory: polyraspad-frontend
        run: npm run lint

      - name: Build
        working-directory: polyraspad-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  landing:
    name: polyraspad-landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: polyraspad-landing/package-lock.json

      - name: Install
        working-directory: polyraspad-landing
        run: npm ci

      - name: Build
        working-directory: polyraspad-landing
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://app.polyraspad.online
          NEXT_PUBLIC_SITE_URL: https://polyraspad.online

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs:
      - vocabulary-service
      - aggregator-service
      - billing-service
      - agent-service
      - media-service
      - authorization-module
      - inclusive
      - frontend
      - landing
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ env.CHECKOUT_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          LANDING_NEXT_PUBLIC_APP_URL: https://app.polyraspad.online
          LANDING_NEXT_PUBLIC_SITE_URL: https://polyraspad.online
