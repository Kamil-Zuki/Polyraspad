name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy stack
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git config --global --add safe.directory "*"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            if [ -n "${{ secrets.SUBMODULES_PAT }}" ]; then
              git config --global url."https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/".insteadOf "https://github.com/"
              git config --global url."https://x-access-token:${{ secrets.SUBMODULES_PAT }}@github.com/".insteadOf "git@github.com:"
            fi
            git fetch origin master
            git reset --hard origin/master
            git submodule sync --recursive
            git submodule update --init --recursive
            docker compose pull
            docker compose build --no-cache
            docker compose up -d
            docker compose ps
            sleep 5
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://127.0.0.1:5000/healthz
